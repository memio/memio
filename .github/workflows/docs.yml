name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'VERSIONING.md'
      - 'CHANGELOG.md'
      - 'couscous.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Couscous
        run: |
          curl -sS https://couscous.io/couscous.phar -o couscous.phar
          chmod +x couscous.phar

      - name: Build documentation
        run: php couscous.phar generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .couscous/generated

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
